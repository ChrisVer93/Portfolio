name: Magnetics Studio Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source availability
        shell: pwsh
        run: |
          if (!(Test-Path 'magnetics_studio/desktop_launcher.py')) { throw 'Magnetics source has not been synchronized yet' }
