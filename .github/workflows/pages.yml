name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify loss engine
        run: npm test
      - name: Refresh offline Loss Lab manual
        run: python .github/scripts/refresh_loss_lab_offline.py
      - name: Build original Magnetics Studio browser preview
        run: python magnetics_studio/tools/build_browser.py dist/tools/magnetics-studio
      - name: Check genuine browser Python and reference fields
        run: |
          npm install --prefix /tmp/magnetics-qa pyodide@0.27.7 jsdom@26.1.0 @napi-rs/canvas@0.1.100
          NODE_PATH=/tmp/magnetics-qa/node_modules node magnetics_studio/tests/browser-runtime.test.cjs dist/tools/magnetics-studio
      - name: Verify original interface in native Chromium
        run: |
          npm install --prefix /tmp/magnetics-qa playwright@1.62.1
          /tmp/magnetics-qa/node_modules/.bin/playwright install --with-deps chromium
          python -m http.server 8765 --directory dist > /tmp/magnetics-http.log 2>&1 &
          NODE_PATH=/tmp/magnetics-qa/node_modules node magnetics_studio/tests/browser-published.cjs http://127.0.0.1:8765/tools/magnetics-studio/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Wait for uploaded Pages artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'github-pages-${{ github.run_id }}-${{ github.run_attempt }}'; // #: Bind metadata lookup to this exact run and attempt, avoiding artifacts from earlier retries.
            for (let attempt = 0; attempt < 6; attempt++) { // #: Bound publication visibility retries to six real API checks.
              const result = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100}); // #: Query actual uploaded artifact metadata using the read-only Actions permission.
              const matches = result.data.artifacts.filter(item => item.name === name && !item.expired); // #: Require the exact current unexpired artifact rather than an earlier similarly named upload.
              if (matches.length === 1) return; // #: Proceed only after exactly one eligible artifact is actually visible.
              if (matches.length > 1) throw Error('Duplicate current Pages artifact'); // #: Reject ambiguous deployment inputs rather than choosing arbitrary bytes.
              await new Promise(resolve => setTimeout(resolve, 3000)); // #: Allow three seconds for metadata visibility before the next bounded check.
            } // #: End the bounded actual-metadata visibility loop.
            throw Error('Current Pages artifact metadata is not visible'); // #: Fail closed without deploying old or missing artifacts.
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

